name: neighbour
x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the shared PostgreSQL connection URL}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL to the shared Redis connection URL}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-marketplace}
  APP_URL: ${APP_URL:?Set APP_URL to your public HTTPS URL}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  UPLOAD_DIR: /app/uploads
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
services:
  migrate:
    networks: [default, shared]
    image: ${MARKETPLACE_TOOLS_IMAGE:-ghcr.io/macmann/marketplace-tools:main}
    restart: "no"
    environment:
      <<: *app-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]
  web:
    networks: [default, shared]
    image: ${MARKETPLACE_WEB_IMAGE:-ghcr.io/macmann/marketplace-web:main}
    restart: unless-stopped
    environment:
      <<: *app-env
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    expose: ["3000"]
    volumes: ["uploads:/app/uploads"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  worker:
    networks: [default, shared]
    volumes: ["uploads:/app/uploads"]
    image: ${MARKETPLACE_TOOLS_IMAGE:-ghcr.io/macmann/marketplace-tools:main}
    restart: unless-stopped
    environment:
      <<: *app-env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "scripts/worker-health.ts"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  uploads:

networks:
  # Coolify manages/replaces the default network with its application network.
  # An explicit external network keeps shared-service access on every service.
  default: {}
  shared:
    external: true
    name: ${COOLIFY_NETWORK:-coolify}
