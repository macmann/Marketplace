name: Validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U marketplace -d marketplace" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      UPLOAD_DIR: /tmp/neighbour-ci-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: bash -n scripts/ops/backup.sh scripts/ops/restore.sh
      - run: npm test
      - run: npm run db:migrate && npm run db:seed
      - run: npm run db:migrate # Verify migration repeatability
      - run: npm run test:integration
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: |
          npm start > /tmp/neighbour-web.log 2>&1 &
          npm run worker > /tmp/neighbour-worker.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health && curl --fail --silent http://localhost:3000/api/ready; then break; fi
            sleep 1
          done
          curl --fail http://localhost:3000/api/health
          curl --fail http://localhost:3000/api/ready
          CHROMIUM_PATH="$(node --input-type=module -e "import {chromium} from '@playwright/test';console.log(chromium.executablePath())")" npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
